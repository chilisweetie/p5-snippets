<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>p5.js Snippets</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --code-bg: #1b1b1f;
    --code-fg: #e8e6e1;
    --text: #1b1b1f;
    --muted: #6a6862;
    --line: #e2dfd7;
    --accent: #1b1b1f;
    --flash: #fff3b0;

    /* where-to-paste colours */
    --p-html: #6b7280;
    --p-top: #7c3aed;
    --p-preload: #0f766e;
    --p-setup: #2563eb;
    --p-draw: #dc4c12;
    --p-keyPressed: #15803d;
    --p-mousePressed: #c0267a;
    --p-end: #a16207;

    /* code colours */
    --c-com: #8a8a93;
    --c-str: #9fd88b;
    --c-num: #f5b971;
    --c-key: #c9a7ff;
    --c-fn: #7cc7ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416;
      --surface: #1d1d21;
      --code-bg: #0e0e10;
      --text: #ecebe7;
      --muted: #9a988f;
      --line: #2e2e33;
      --accent: #ecebe7;
      --flash: #4a4220;
      --p-html: #9ca3af;
      --p-top: #a78bfa;
      --p-preload: #2dd4bf;
      --p-setup: #60a5fa;
      --p-draw: #fb8a5c;
      --p-keyPressed: #4ade80;
      --p-mousePressed: #f472b6;
      --p-end: #facc15;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416;
    --surface: #1d1d21;
    --code-bg: #0e0e10;
    --text: #ecebe7;
    --muted: #9a988f;
    --line: #2e2e33;
    --accent: #ecebe7;
    --flash: #4a4220;
    --p-html: #9ca3af;
    --p-top: #a78bfa;
    --p-preload: #2dd4bf;
    --p-setup: #60a5fa;
    --p-draw: #fb8a5c;
    --p-keyPressed: #4ade80;
    --p-mousePressed: #f472b6;
    --p-end: #facc15;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: 140px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif;
  }
  code, pre, .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  a { color: inherit; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

  header { padding: 48px 0 24px; }
  header h1 { margin: 0 0 4px; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }

  /* ---------- sketch map ---------- */
  .map {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .map h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .map > p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .map-rows { display: grid; gap: 4px; }
  .map-row {
    display: grid;
    grid-template-columns: 148px 1fr;
    align-items: center;
    gap: 12px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .map-row:hover { background: var(--bg); }
  .map-row.active { border-color: var(--pc); background: var(--bg); }
  .map-row code { font-size: 13px; color: var(--muted); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .map-row code b { color: var(--text); font-weight: 500; }

  .chip {
    --pc: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace;
    color: var(--pc);
    border: 1.5px solid var(--pc);
    border-radius: 999px;
    padding: 4px 9px;
    white-space: nowrap;
    width: max-content;
  }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pc); }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .search {
    width: 100%;
    font: inherit;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .pill {
    font: 500 13px/1 "IBM Plex Sans", sans-serif;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .pill[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 20px; }
  .status button { font: inherit; background: none; border: none; color: var(--text); text-decoration: underline; cursor: pointer; padding: 0; }

  /* ---------- cards ---------- */
  .cat { margin: 32px 0 12px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
    transition: background 0.6s;
  }
  .card.flash { background: var(--flash); }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .card h3 a { text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .level { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
  .desc { margin: 6px 0 0; color: var(--muted); }

  .part { margin-top: 16px; }
  .part-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .step { font: 500 12px/1 "IBM Plex Mono", monospace; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); }
  .note { font-size: 13px; margin: 0 0 6px; }
  .note::before { content: "→ "; color: var(--muted); }

  .code { position: relative; }
  .code pre {
    margin: 0;
    background: var(--code-bg);
    color: var(--code-fg);
    border-radius: 10px;
    border-left: 4px solid var(--pc);
    padding: 14px 16px;
    padding-right: 76px;
    font-size: 13.5px;
    line-height: 1.6;
    overflow-x: auto;
  }
  .copy {
    position: absolute;
    top: 8px;
    right: 8px;
    font: 500 12px/1 "IBM Plex Sans", sans-serif;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid #3a3a42;
    background: #26262c;
    color: #e8e6e1;
    cursor: pointer;
  }
  .copy:hover { background: #33333a; }
  .copy.done { background: #e8e6e1; color: #1b1b1f; }

  .tip { margin: 14px 0 0; font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--bg); }
  .tip b { font-weight: 600; }

  .t-com { color: var(--c-com); font-style: italic; }
  .t-str { color: var(--c-str); }
  .t-num { color: var(--c-num); }
  .t-key { color: var(--c-key); }
  .t-fn  { color: var(--c-fn); }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; }

  footer { padding: 48px 0 64px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer button { font: inherit; background: none; border: none; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; }

  @media (max-width: 600px) {
    header { padding-top: 28px; }
    header h1 { font-size: 26px; }
    .map-row { grid-template-columns: 1fr; gap: 4px; }
    .card { padding: 16px; }
    .toolbar { position: static; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="site-title">p5.js Snippets</h1>
      <p id="site-subtitle"></p>
    </header>

    <section class="map" aria-labelledby="map-title">
      <h2 id="map-title">Where does it go?</h2>
      <p>Every snippet is tagged with a colour. This is where each colour lives in your sketch. Click one to see only those snippets.</p>
      <div class="map-rows" id="map"></div>
    </section>
  </div>

  <div class="toolbar">
    <div class="wrap">
      <input class="search" id="search" type="search" placeholder="Search snippets — e.g. save, slider, webcam, pinch" aria-label="Search snippets" />
      <div class="filters" id="filters"></div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
  </div>

  <main class="wrap" id="list"></main>

  <div class="wrap">
    <footer>
      <span id="site-footer"></span>
      <button id="theme">Switch theme</button>
    </footer>
  </div>

<script src="snippets.js"></script>
<script>
  // ---------- where-to-paste definitions ----------
  const PLACES = {
    html:         { label: 'index.html',      map: '&lt;head&gt; … <b>&lt;script src="…"&gt;&lt;/script&gt;</b> … &lt;/head&gt;', hint: 'Open index.html and paste inside <head>, below the other <script> lines.' },
    top:          { label: 'top of sketch',   map: '<b>let x = 0;</b>    // above setup, outside every function', hint: 'Paste at the very top of sketch.js, above function setup().' },
    preload:      { label: 'preload()',       map: 'function preload() { <b>…</b> }', hint: 'Paste inside function preload() { }. No preload yet? Add one above setup().' },
    setup:        { label: 'setup()',         map: 'function setup() { <b>…</b> }    // runs once', hint: 'Paste inside function setup() { }, after createCanvas(...).' },
    draw:         { label: 'draw()',          map: 'function draw() { <b>…</b> }     // runs every frame', hint: 'Paste inside function draw() { }.' },
    keyPressed:   { label: 'keyPressed()',    map: 'function keyPressed() { <b>…</b> }', hint: 'Paste inside function keyPressed() { }. No keyPressed yet? Add one at the end of your sketch. Only ever have one.' },
    mousePressed: { label: 'mousePressed()',  map: 'function mousePressed() { <b>…</b> }', hint: 'Paste inside function mousePressed() { }. No mousePressed yet? Add one at the end of your sketch. Only ever have one.' },
    end:          { label: 'end of sketch',   map: '<b>function myFunction() { … }</b>  // a new function', hint: 'Paste at the very end of sketch.js, after the last }, outside every function.' },
  };

  const LEVELS = { all: 'All levels', beginner: 'Beginner', intermediate: 'Intermediate' };

  const state = { q: '', cat: 'All', level: 'all', place: null };

  const $ = (s) => document.querySelector(s);
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ---------- tiny JS highlighter ----------
  const TOKEN = /(\/\/.*$)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|(\b\d+(?:\.\d+)?\b)|(\b(?:let|const|var|function|if|else|for|of|return|new|true|false|while)\b)|(\b[a-zA-Z_]\w*(?=\s*\())/gm;
  function highlight(code, isHtml) {
    if (isHtml) return esc(code);
    let out = '', last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(code))) {
      out += esc(code.slice(last, m.index));
      const cls = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : m[4] ? 'key' : 'fn';
      out += '<span class="t-' + cls + '">' + esc(m[0]) + '</span>';
      last = TOKEN.lastIndex;
    }
    return out + esc(code.slice(last));
  }

  // ---------- copy ----------
  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    btn.textContent = 'Copied';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1400);
  }

  // ---------- render map ----------
  function renderMap() {
    $('#map').innerHTML = Object.entries(PLACES).map(([k, p]) =>
      '<button class="map-row' + (state.place === k ? ' active' : '') + '" data-place="' + k + '" style="--pc: var(--p-' + k + ')" aria-pressed="' + (state.place === k) + '">' +
        '<span class="chip" style="--pc: var(--p-' + k + ')">' + esc(p.label) + '</span>' +
        '<code>' + p.map + '</code>' +
      '</button>'
    ).join('');
  }

  // ---------- render filters ----------
  function renderFilters() {
    const cats = ['All', ...new Set(SNIPPETS.map((s) => s.category))];
    let html = cats.map((c) => '<button class="pill" data-cat="' + esc(c) + '" aria-pressed="' + (state.cat === c) + '">' + esc(c) + '</button>').join('');
    html += '<span class="sep"></span>';
    html += Object.entries(LEVELS).map(([k, v]) => '<button class="pill" data-level="' + k + '" aria-pressed="' + (state.level === k) + '">' + v + '</button>').join('');
    $('#filters').innerHTML = html;
  }

  // ---------- render list ----------
  function matches(s) {
    if (state.cat !== 'All' && s.category !== state.cat) return false;
    if (state.level !== 'all' && s.level !== state.level) return false;
    if (state.place && !s.parts.some((p) => p.where === state.place)) return false;
    if (state.q) {
      const hay = [s.title, s.description, s.category, s.tip || '', ...s.parts.map((p) => p.code + ' ' + (p.note || ''))].join(' ').toLowerCase();
      return state.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
    }
    return true;
  }

  function renderList() {
    const shown = SNIPPETS.filter(matches);
    const groups = {};
    shown.forEach((s) => (groups[s.category] = groups[s.category] || []).push(s));

    let html = '';
    for (const [cat, items] of Object.entries(groups)) {
      html += '<h2 class="cat">' + esc(cat) + '</h2>';
      for (const s of items) {
        html += '<article class="card" id="' + esc(s.id) + '">';
        html += '<div class="card-head"><h3><a href="#' + esc(s.id) + '">' + esc(s.title) + '</a></h3>';
        html += '<span class="level">' + (s.level === 'intermediate' ? 'Intermediate' : 'Beginner') + '</span></div>';
        html += '<p class="desc">' + esc(s.description) + '</p>';

        s.parts.forEach((p, i) => {
          const place = PLACES[p.where] || { label: p.where, hint: '' };
          html += '<div class="part" style="--pc: var(--p-' + p.where + ')">';
          html += '<div class="part-head">';
          if (s.parts.length > 1) html += '<span class="step">' + (i + 1) + '/' + s.parts.length + '</span>';
          html += '<span class="chip" style="--pc: var(--p-' + p.where + ')">' + esc(place.label) + '</span>';
          html += '<span class="hint">' + esc(place.hint) + '</span></div>';
          if (p.note) html += '<p class="note">' + esc(p.note) + '</p>';
          html += '<div class="code"><pre><code>' + highlight(p.code, p.where === 'html') + '</code></pre>';
          html += '<button class="copy" data-id="' + esc(s.id) + '" data-part="' + i + '">Copy</button></div>';
          html += '</div>';
        });

        if (s.tip) html += '<p class="tip"><b>Tip</b> · ' + esc(s.tip) + '</p>';
        html += '</article>';
      }
    }
    $('#list').innerHTML = html || '<p class="empty">No snippets match. Try another word.</p>';

    const filtered = state.q || state.cat !== 'All' || state.level !== 'all' || state.place;
    let status = shown.length + ' of ' + SNIPPETS.length + ' snippets';
    if (state.place) status += ' with a part for ' + PLACES[state.place].label;
    $('#status').innerHTML = esc(status) + (filtered ? ' · <button id="reset">Show all</button>' : '');
  }

  function render() { renderMap(); renderFilters(); renderList(); }

  // ---------- events ----------
  $('#search').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderList(); });

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.cat) { state.cat = t.dataset.cat; render(); }
    else if (t.dataset.level) { state.level = t.dataset.level; render(); }
    else if (t.dataset.place) { state.place = state.place === t.dataset.place ? null : t.dataset.place; render(); }
    else if (t.id === 'reset') { state.q = ''; state.cat = 'All'; state.level = 'all'; state.place = null; $('#search').value = ''; render(); }
    else if (t.classList.contains('copy')) {
      const s = SNIPPETS.find((x) => x.id === t.dataset.id);
      copyText(s.parts[+t.dataset.part].code, t);
    }
    else if (t.id === 'theme') {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (err) {}
    }
  });

  // ---------- jump to #snippet from a link ----------
  function flashHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (!id) return;
    let el = document.getElementById(id);
    if (!el && SNIPPETS.some((s) => s.id === id)) {
      state.q = ''; state.cat = 'All'; state.level = 'all'; state.place = null; $('#search').value = '';
      render();
      el = document.getElementById(id);
    }
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1500);
  }
  window.addEventListener('hashchange', flashHash);

  // ---------- start ----------
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (err) {}
  document.title = SITE.title;
  $('#site-title').textContent = SITE.title;
  $('#site-subtitle').textContent = SITE.subtitle;
  $('#site-footer').textContent = SITE.footer;
  render();
  flashHash();
</script>
</body>
</html>
