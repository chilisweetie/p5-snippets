<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>p5.js Snippets</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --text: #0a0a0a;
    --muted: #737373;
    --faint: #a3a3a3;
    --line: #ebebeb;
    --hover: #f5f5f5;
    --code-bg: #f7f7f7;
    --code-fg: #171717;
    --flash: #fff8c5;

    --p-html: #737373;
    --p-top: #7c3aed;
    --p-preload: #0d9488;
    --p-setup: #2563eb;
    --p-draw: #ea580c;
    --p-keyPressed: #16a34a;
    --p-mousePressed: #db2777;
    --p-end: #ca8a04;

    --c-com: #a3a3a3;
    --c-str: #15803d;
    --c-num: #c2410c;
    --c-key: #7c3aed;
    --c-fn: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a0a; --text: #ededed; --muted: #8f8f8f; --faint: #5c5c5c;
      --line: #222222; --hover: #161616; --code-bg: #121212; --code-fg: #e5e5e5; --flash: #2a2612;
      --p-html: #a3a3a3; --p-top: #a78bfa; --p-preload: #2dd4bf; --p-setup: #60a5fa;
      --p-draw: #fb923c; --p-keyPressed: #4ade80; --p-mousePressed: #f472b6; --p-end: #facc15;
      --c-com: #5c5c5c; --c-str: #86efac; --c-num: #fdba74; --c-key: #c4b5fd; --c-fn: #93c5fd;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a; --text: #ededed; --muted: #8f8f8f; --faint: #5c5c5c;
    --line: #222222; --hover: #161616; --code-bg: #121212; --code-fg: #e5e5e5; --flash: #2a2612;
    --p-html: #a3a3a3; --p-top: #a78bfa; --p-preload: #2dd4bf; --p-setup: #60a5fa;
    --p-draw: #fb923c; --p-keyPressed: #4ade80; --p-mousePressed: #f472b6; --p-end: #facc15;
    --c-com: #5c5c5c; --c-str: #86efac; --c-num: #fdba74; --c-key: #c4b5fd; --c-fn: #93c5fd;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: 24px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Geist", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, pre, .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* ---------- layout ---------- */
  .layout { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }
  aside {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    border-right: 1px solid var(--line);
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  main { padding: 32px 48px 96px; max-width: 920px; width: 100%; min-width: 0; }
  aside { min-width: 0; }

  /* ---------- sidebar ---------- */
  .brand h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  .search {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 10px 0;
    border: 0;
    border-bottom: 1px solid var(--text);
    background: transparent;
    color: var(--text);
    border-radius: 0;
  }
  .search::placeholder { color: var(--faint); }
  .search:focus { outline: none; border-bottom-width: 2px; padding-bottom: 9px; }

  .label {
    font: 500 11px/1 "Geist Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
  }

  .places { display: flex; flex-direction: column; }
  .place {
    display: grid;
    grid-template-columns: 10px auto 1fr;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    margin: 0 -8px;
    text-align: left;
    border-radius: 4px;
  }
  .place:hover { background: var(--hover); }
  .place .sq { width: 8px; height: 8px; background: var(--pc); }
  .place .name { font: 500 13px/1.2 "Geist Mono", monospace; }
  .place .what { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
  .place[aria-pressed="true"] { background: var(--hover); }
  .place[aria-pressed="true"] .name { color: var(--pc); }
  .places-help { font-size: 12.5px; color: var(--faint); margin: 8px 0 0; }

  .topics { display: flex; flex-direction: column; }
  .topic {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 8px;
    margin: 0 -8px;
    border-radius: 4px;
    text-align: left;
    color: var(--muted);
  }
  .topic:hover { background: var(--hover); color: var(--text); }
  .topic[aria-pressed="true"] { color: var(--text); font-weight: 500; }
  .topic .n { font: 12px "Geist Mono", monospace; color: var(--faint); }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
  .seg button { padding: 6px 4px; font-size: 13px; color: var(--muted); border-radius: 4px; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  .side-foot { margin-top: auto; display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--faint); }
  .side-foot button:hover { color: var(--text); }

  /* ---------- results ---------- */
  .results-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 16px;
    font: 12.5px "Geist Mono", monospace;
    color: var(--muted);
  }
  .results-head button { text-decoration: underline; text-underline-offset: 3px; }
  .results-head button:hover { color: var(--text); }

  .cat {
    margin: 48px 0 0;
    padding-bottom: 12px;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.03em;
  }
  .cat:first-of-type { margin-top: 8px; }

  .snip {
    border-top: 1px solid var(--line);
    padding: 28px 0 32px;
    transition: background 0.8s;
  }
  .snip.flash { background: var(--flash); }
  .snip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .snip h3 { margin: 0; font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
  .snip h3 a { color: inherit; text-decoration: none; }
  .snip h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .lvl { font: 11px "Geist Mono", monospace; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); white-space: nowrap; }
  .desc { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }

  .part { margin-top: 20px; }
  .part-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .step { font: 12px "Geist Mono", monospace; color: var(--faint); }
  .where { display: inline-flex; align-items: center; gap: 7px; font: 500 12.5px "Geist Mono", monospace; color: var(--pc); }
  .where::before { content: ""; width: 8px; height: 8px; background: var(--pc); }
  .hint { font-size: 13px; color: var(--muted); }
  .note { font-size: 13.5px; margin: 0 0 8px; }

  .code { position: relative; }
  .code pre {
    margin: 0;
    background: var(--code-bg);
    color: var(--code-fg);
    border-left: 2px solid var(--pc);
    padding: 16px 18px;
    padding-right: 72px;
    font-size: 13px;
    line-height: 1.7;
    overflow-x: auto;
  }
  .copy {
    position: absolute;
    top: 10px;
    right: 10px;
    font: 500 11px "Geist Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    color: var(--muted);
  }
  .copy:hover { color: var(--text); border-color: var(--muted); }
  .copy.done { background: var(--text); color: var(--bg); border-color: var(--text); }

  .tip { margin: 16px 0 0; font-size: 13.5px; color: var(--muted); max-width: 70ch; }
  .tip b { color: var(--text); font-weight: 500; }

  .t-com { color: var(--c-com); }
  .t-str { color: var(--c-str); }
  .t-num { color: var(--c-num); }
  .t-key { color: var(--c-key); }
  .t-fn  { color: var(--c-fn); }

  .empty { color: var(--muted); padding: 64px 0; border-top: 1px solid var(--line); }

  /* ---------- small screens ---------- */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 24px 16px; gap: 24px; }
    main { padding: 24px 16px 64px; }
    .cat { font-size: 24px; }
    .side-foot { margin-top: 0; }
  }
</style>
</head>
<body>
<div class="layout">

  <aside>
    <div class="brand">
      <h1 id="site-title">p5.js Snippets</h1>
      <p id="site-subtitle"></p>
    </div>

    <input class="search" id="search" type="search" placeholder="Search — save, slider, webcam…" aria-label="Search snippets" />

    <section>
      <p class="label">Where it goes</p>
      <div class="places" id="places"></div>
      <p class="places-help">In sketch order, top to bottom. Click to filter.</p>
    </section>

    <section>
      <p class="label">Topic</p>
      <div class="topics" id="topics"></div>
    </section>

    <section>
      <p class="label">Level</p>
      <div class="seg" id="levels"></div>
    </section>

    <div class="side-foot">
      <span id="site-footer"></span>
      <button id="theme">Theme</button>
    </div>
  </aside>

  <main>
    <div class="results-head" id="status" aria-live="polite"></div>
    <div id="list"></div>
  </main>

</div>

<script src="snippets.js"></script>
<script>
  // ---------- where-to-paste definitions ----------
  const PLACES = {
    html:         { label: 'index.html',     what: 'inside <head>',     hint: 'Open index.html and paste inside <head>, below the other <script> lines.' },
    top:          { label: 'top',            what: 'above setup()',     hint: 'Paste at the very top of sketch.js, above function setup().' },
    preload:      { label: 'preload()',      what: 'loads files first', hint: 'Paste inside function preload() { }. No preload yet? Add one above setup().' },
    setup:        { label: 'setup()',        what: 'runs once',         hint: 'Paste inside function setup() { }, after createCanvas(...).' },
    draw:         { label: 'draw()',         what: 'runs every frame',  hint: 'Paste inside function draw() { }.' },
    keyPressed:   { label: 'keyPressed()',   what: 'on key press',      hint: 'Paste inside function keyPressed() { }. None yet? Add one at the end of your sketch. Only ever have one.' },
    mousePressed: { label: 'mousePressed()', what: 'on click',          hint: 'Paste inside function mousePressed() { }. None yet? Add one at the end of your sketch. Only ever have one.' },
    end:          { label: 'end',            what: 'a new function',    hint: 'Paste at the very end of sketch.js, after the last }, outside every function.' },
  };
  const LEVELS = { all: 'All', beginner: 'Beginner', intermediate: 'Inter.' };

  const state = { q: '', cat: 'All', level: 'all', place: null };
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ---------- tiny JS highlighter ----------
  const TOKEN = /(\/\/.*$)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|(\b\d+(?:\.\d+)?\b)|(\b(?:let|const|var|function|if|else|for|of|return|new|true|false|while)\b)|(\b[a-zA-Z_]\w*(?=\s*\())/gm;
  function highlight(code, isHtml) {
    if (isHtml) return esc(code);
    let out = '', last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(code))) {
      out += esc(code.slice(last, m.index));
      const cls = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'num' : m[4] ? 'key' : 'fn';
      out += '<span class="t-' + cls + '">' + esc(m[0]) + '</span>';
      last = TOKEN.lastIndex;
    }
    return out + esc(code.slice(last));
  }

  // ---------- copy ----------
  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    btn.textContent = 'Copied';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1400);
  }

  // ---------- filtering ----------
  function matches(s, ignoreCat) {
    if (!ignoreCat && state.cat !== 'All' && s.category !== state.cat) return false;
    if (state.level !== 'all' && s.level !== state.level) return false;
    if (state.place && !s.parts.some((p) => p.where === state.place)) return false;
    if (state.q) {
      const hay = [s.title, s.description, s.category, s.tip || '', ...s.parts.map((p) => p.code + ' ' + (p.note || ''))].join(' ').toLowerCase();
      return state.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
    }
    return true;
  }

  // ---------- sidebar ----------
  function renderSidebar() {
    $('#places').innerHTML = Object.entries(PLACES).map(([k, p]) =>
      '<button class="place" data-place="' + k + '" style="--pc: var(--p-' + k + ')" aria-pressed="' + (state.place === k) + '">' +
        '<span class="sq"></span><span class="name">' + esc(p.label) + '</span><span class="what">' + esc(p.what) + '</span>' +
      '</button>'
    ).join('');

    const pool = SNIPPETS.filter((s) => matches(s, true));
    const cats = ['All', ...new Set(SNIPPETS.map((s) => s.category))];
    $('#topics').innerHTML = cats.map((c) => {
      const n = c === 'All' ? pool.length : pool.filter((s) => s.category === c).length;
      return '<button class="topic" data-cat="' + esc(c) + '" aria-pressed="' + (state.cat === c) + '"><span>' + esc(c) + '</span><span class="n">' + n + '</span></button>';
    }).join('');

    $('#levels').innerHTML = Object.entries(LEVELS).map(([k, v]) =>
      '<button data-level="' + k + '" aria-pressed="' + (state.level === k) + '">' + v + '</button>'
    ).join('');
  }

  // ---------- results ----------
  function renderList() {
    const shown = SNIPPETS.filter((s) => matches(s));
    const groups = {};
    shown.forEach((s) => (groups[s.category] = groups[s.category] || []).push(s));

    let html = '';
    for (const [cat, items] of Object.entries(groups)) {
      html += '<h2 class="cat">' + esc(cat) + '</h2>';
      for (const s of items) {
        html += '<article class="snip" id="' + esc(s.id) + '">';
        html += '<div class="snip-head"><h3><a href="#' + esc(s.id) + '">' + esc(s.title) + '</a></h3>';
        html += '<span class="lvl">' + esc(s.level) + '</span></div>';
        html += '<p class="desc">' + esc(s.description) + '</p>';

        s.parts.forEach((p, i) => {
          const place = PLACES[p.where] || { label: p.where, hint: '' };
          html += '<div class="part" style="--pc: var(--p-' + p.where + ')">';
          html += '<div class="part-head">';
          if (s.parts.length > 1) html += '<span class="step">' + String(i + 1).padStart(2, '0') + '</span>';
          html += '<span class="where">' + esc(place.label) + '</span>';
          html += '<span class="hint">' + esc(place.hint) + '</span></div>';
          if (p.note) html += '<p class="note">' + esc(p.note) + '</p>';
          html += '<div class="code"><pre><code>' + highlight(p.code, p.where === 'html') + '</code></pre>';
          html += '<button class="copy" data-id="' + esc(s.id) + '" data-part="' + i + '">Copy</button></div>';
          html += '</div>';
        });

        if (s.tip) html += '<p class="tip"><b>Tip</b> — ' + esc(s.tip) + '</p>';
        html += '</article>';
      }
    }
    $('#list').innerHTML = html || '<p class="empty">Nothing matches. Try another word.</p>';

    const filtered = state.q || state.cat !== 'All' || state.level !== 'all' || state.place;
    let status = shown.length + ' / ' + SNIPPETS.length + ' snippets';
    if (state.place) status += ' · ' + PLACES[state.place].label;
    $('#status').innerHTML = '<span>' + esc(status) + '</span>' + (filtered ? '<button id="reset">Clear filters</button>' : '');
  }

  function render() { renderSidebar(); renderList(); }

  // ---------- events ----------
  $('#search').addEventListener('input', (e) => { state.q = e.target.value.trim(); render(); });

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.cat) { state.cat = t.dataset.cat; render(); }
    else if (t.dataset.level) { state.level = t.dataset.level; render(); }
    else if (t.dataset.place) { state.place = state.place === t.dataset.place ? null : t.dataset.place; render(); }
    else if (t.id === 'reset') { state.q = ''; state.cat = 'All'; state.level = 'all'; state.place = null; $('#search').value = ''; render(); }
    else if (t.classList.contains('copy')) {
      const s = SNIPPETS.find((x) => x.id === t.dataset.id);
      copyText(s.parts[+t.dataset.part].code, t);
    }
    else if (t.id === 'theme') {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (err) {}
    }
  });

  // ---------- jump to #snippet from a link ----------
  function flashHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (!id) return;
    let el = document.getElementById(id);
    if (!el && SNIPPETS.some((s) => s.id === id)) {
      state.q = ''; state.cat = 'All'; state.level = 'all'; state.place = null; $('#search').value = '';
      render();
      el = document.getElementById(id);
    }
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1600);
  }
  window.addEventListener('hashchange', flashHash);

  // ---------- start ----------
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (err) {}
  document.title = SITE.title;
  $('#site-title').textContent = SITE.title;
  $('#site-subtitle').textContent = SITE.subtitle;
  $('#site-footer').textContent = SITE.footer;
  render();
  flashHash();
</script>
</body>
</html>
